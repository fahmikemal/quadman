name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...
      - run: test -z "$(gofmt -l .)"
      # The PTY e2e harness needs a live user session, so CI only keeps
      # it compiling and vetted.
      - run: cd e2e && go build ./... && go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: golangci-lint (main module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint (e2e module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: e2e

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build -o quadman .
      - run: ./quadman -version
      - name: Run podman rootless in the runner
        run: |
          podman info --storage-driver=vfs
          ./quadman list

  security:
    runs-on: ubuntu-latest
    env:
      # Pinned: an unpinned scanner turns CI red on its own release day,
      # with no change in this repository. Bump deliberately.
      GOVULNCHECK_VERSION: v1.9.0
      GOSEC_VERSION: v2.29.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Dependency vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - name: Static security analysis (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} -quiet ./...
